<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />

<title>Só por Hoje — Um novo modo de viver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --leather:#241811;
    --leather-dark:#160E09;
    --gold:#B8912F;
    --gold-soft:#D9BE7E;
    --paper:#F4EEDD;
    --paper-edge:#E4DABF;
    --ink:#2A2016;
    --ink-soft:#5B4E3C;
    --room:#141210;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 35%, #221D18 0%, var(--room) 70%);
    font-family:'Lora', serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective: 2200px;
  }

  /* ---------- Flame signature (cover only) ---------- */
  .flame-wrap{ display:flex; justify-content:center; margin-bottom: 18px; }
  .flame{
    width:14px; height:20px;
    background: radial-gradient(circle at 50% 30%, var(--gold-soft), var(--gold) 55%, transparent 75%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    filter: blur(0.3px);
    animation: flicker 3.2s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes flicker{
    0%,100%{ transform: scaleY(1) scaleX(1) rotate(0deg); opacity:.95; }
    25%{ transform: scaleY(1.08) scaleX(.94) rotate(-2deg); opacity:1; }
    50%{ transform: scaleY(.92) scaleX(1.05) rotate(1deg); opacity:.88; }
    75%{ transform: scaleY(1.04) scaleX(.97) rotate(-1deg); opacity:1; }
  }

  /* ---------- Book stack (paper thickness illusion) ---------- */
  #book{
    position:relative;
    width: min(92vw, 480px);
    height: min(80vh, 660px);
    box-shadow:
      2px 2px 0 var(--paper-edge),
      4px 4px 0 var(--paper-edge),
      6px 6px 0 #D8CCAC,
      8px 8px 18px rgba(0,0,0,.55);
    border-radius: 3px 6px 6px 3px;
  }
  .leaf{
    position:absolute; inset:0;
    background: var(--paper);
    border-radius: 3px 6px 6px 3px;
    backface-visibility:hidden;
    transform-style:preserve-3d;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(120,100,60,.08);
  }
  #back{ z-index:1; }
  #front{ z-index:2; transition: transform .68s cubic-bezier(.45,.05,.35,1); }
  #front.no-anim{ transition:none !important; }
  #front::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(90deg, rgba(0,0,0,.12), transparent 6%, transparent 94%, rgba(0,0,0,.08));
    opacity:0; transition: opacity .68s ease;
  }
  #front.flip-next, #front.flip-prev{}
  #front.flip-next::after, #front.flip-prev::after{ opacity:1; }

  .page-inner{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding: 40px 34px 30px;
    color: var(--ink);
  }

  /* Page number */
  .pageno{
    position:absolute; bottom:14px; left:0; right:0;
    text-align:center; font-family:'Lora', serif; font-style:italic;
    font-size:11px; color: var(--ink-soft); letter-spacing:.04em;
  }

  /* ---------- Content types ---------- */
  .cover-page{ align-items:center; justify-content:center; text-align:center;
    background: radial-gradient(ellipse at 50% 20%, #2E2119 0%, var(--leather) 55%, var(--leather-dark) 100%);
    color: var(--gold-soft);
  }
  .cover-page .title{ font-family:'Fraunces', serif; font-weight:600; font-size: clamp(28px,7vw,40px); letter-spacing:.05em; color:var(--gold); margin:0 0 10px; }
  .cover-page .subtitle{ font-family:'Fraunces', serif; font-style:italic; font-weight:400; font-size: clamp(14px,3.2vw,17px); color: var(--gold-soft); opacity:.85; margin:0; }
  .cover-page .rule{ width:70px; height:1px; background: var(--gold); opacity:.5; margin: 22px auto; }
  .cover-page .hint{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color: var(--gold-soft); opacity:.55; margin-top:26px; }

  .backcover-page{ align-items:center; justify-content:center; text-align:center;
    background: radial-gradient(ellipse at 50% 80%, #2E2119 0%, var(--leather) 55%, var(--leather-dark) 100%);
    color: var(--gold-soft);
  }
  .backcover-page .brand{ font-family:'Fraunces', serif; font-style:italic; font-size:15px; opacity:.7; }

  .quote-page{ align-items:center; justify-content:center; text-align:center; }
  .quote-page p{ font-family:'Fraunces', serif; font-style:italic; font-size: clamp(15px,4vw,18px); line-height:1.7; color:var(--ink); margin:4px 0; }

  .section-page .eyebrow{ font-family:'Lora', serif; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); opacity:.8; margin-bottom:6px; }
  .section-page h2{ font-family:'Fraunces', serif; font-weight:600; font-size: clamp(20px,5vw,25px); margin: 0 0 18px; color:var(--ink); line-height:1.25; }
  .section-page .placeholder{ font-style:italic; color:var(--ink-soft); border-top:1px dashed var(--paper-edge); border-bottom:1px dashed var(--paper-edge); padding:14px 0; text-align:center; }
  .section-page .body{ overflow:auto; }
  .body p{ font-size: clamp(13.5px,3.6vw,15px); line-height:1.75; margin:0 0 11px; }

  .part-page{ align-items:center; justify-content:center; text-align:center; }
  .part-page .rule{ width:44px; height:1px; background:var(--gold); margin:16px auto; opacity:.6; }
  .part-page h1{ font-family:'Fraunces', serif; font-weight:600; font-size: clamp(18px,5vw,23px); letter-spacing:.04em; color:var(--ink); line-height:1.4; margin:0; }

  .chapter-page .eyebrow{ text-align:center; font-family:'Lora', serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .chapter-page h2{ text-align:center; font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size: clamp(15px,4vw,18px); color:var(--ink-soft); margin:0 0 20px; }
  .chapter-page .body{ overflow:auto; }

  .toc-page h2{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; text-align:center; margin:0 0 16px; color:var(--ink); }
  .toc-list{ overflow:auto; font-size:13px; }
  .toc-item{ padding:5px 0; cursor:pointer; border-bottom:1px dotted var(--paper-edge); }
  .toc-item.heading{ font-weight:600; color:var(--gold); text-transform:uppercase; font-size:11px; letter-spacing:.08em; border-bottom:none; margin-top:10px; cursor:default; }
  .toc-item.indent{ padding-left:16px; color:var(--ink); }
  .toc-item:not(.heading):hover{ color:var(--gold); }

  /* ---------- Nav chrome ---------- */
  .navzone{ position:absolute; top:0; bottom:0; width:32%; z-index:5; cursor:pointer; }
  .navzone.left{ left:0; }
  .navzone.right{ right:0; }

  #chrome{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .chrome-btn{
    pointer-events:auto;
    background: rgba(244,238,221,.08);
    border:1px solid rgba(216,190,126,.35);
    color: var(--gold-soft);
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer;
    backdrop-filter: blur(6px);
    transition: background .2s, transform .15s;
  }
  .chrome-btn:hover{ background: rgba(216,190,126,.18); }
  .chrome-btn:active{ transform: scale(.92); }
  .chrome-btn:disabled{ opacity:.3; cursor:default; }
  #pageCounter{
    pointer-events:auto;
    font-family:'Lora', serif; font-size:11px; color: var(--gold-soft); opacity:.7;
    min-width:64px; text-align:center; letter-spacing:.03em;
  }
  #playBtn.playing{ background: rgba(216,190,126,.28); color:#fff; }
  #narrationNote{
    position:fixed; bottom:64px; left:0; right:0; z-index:10;
    text-align:center; font-family:'Lora', serif; font-style:italic;
    font-size:11px; color:var(--gold-soft); opacity:0; letter-spacing:.04em;
    transition:opacity .3s; pointer-events:none;
  }
  #narrationNote.show{ opacity:.75; }

  #tocBtn{
    position:fixed; top:18px; left:18px; z-index:10;
  }
  #closeReaderNote{
    position:fixed; top:18px; right:18px; z-index:10;
    font-family:'Lora', serif; font-size:10px; color:var(--gold-soft); opacity:.45;
    letter-spacing:.08em; text-transform:uppercase;
  }

  #tocDrawer{
    position:fixed; inset:0; z-index:20;
    background: rgba(15,11,8,.72);
    backdrop-filter: blur(4px);
    display:none; align-items:center; justify-content:center;
  }
  #tocDrawer.open{ display:flex; }
  #tocPanel{
    width:min(90vw,380px); max-height:78vh; overflow:auto;
    background: var(--paper); border-radius:6px; padding:26px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #tocPanel h2{ font-family:'Fraunces', serif; font-size:19px; margin:0 0 14px; text-align:center; }

  @media (prefers-reduced-motion: reduce){
    #front{ transition:none !important; }
    .flame{ animation:none; }
  }
</style>
</head>
